<html>
  <head>
    <tittle>Map tag</tittle>
  </head>
  <body>
    <p>use of image, map and area tag</p>
    <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8"
         usemap="#workplace"
         width="1000"
         height="870"
         alt="Workplace Layout">
         <map name="workplace">
          <area shape="circle"
                coords="600,134,890,54"
                alt="Computer"
                href="https://www.google.com"
                target="_blank">
          <area shape="rect"
                coords="456,647,123"
                alt="Coffee"
                href="https://en.wikipedia.org/wiki/Coffee"
                target="_blank"
              </map>
             
  </body>
</html>
